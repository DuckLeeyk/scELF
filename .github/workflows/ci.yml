name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Numba / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    env:
      SCELF_BUILD_CPP: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install a non-editable Numba-only package
        run: python -m pip install ".[test]"
      - name: Verify installed import, fit, metadata and actual fallback
        run: python -I tests/check_installation.py --expected-backend numba
      - name: Run synthetic tests and compact example checks
        run: python -m unittest discover -s tests -v

  native:
    name: Required C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SCELF_BUILD_CPP: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Require native compilation
        run: python -m pip install ".[test]"
      - name: Require the installed C++ backend and run a synthetic fit
        run: python -I tests/check_installation.py --expected-backend cpp
      - name: Run numerical and cross-backend tests
        run: python -m unittest discover -s tests -v

  analysis:
    name: Optional analysis dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SCELF_BUILD_CPP: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,analysis,comparators]"
      - name: Check optional dependency imports
        run: python -c "import anndata, pandas_plink, pysusie, sklearn, xarray"
      - name: Test synthetic preparation, comparators and downstream tables
        run: python -m unittest discover -s tests -p "test_onek1k_workflows.py" -v

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation tools independently of the model
        run: python -m pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - run: python -m mkdocs build --strict
